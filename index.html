<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ms.옥 포트폴리오</title>
  <style>
    :root {
      --bg: #f2f4f6;
      --card: #ffffff;
      --text: #191f28;
      --sub: #6b7684;
      --muted: #8b95a1;
      --border: #e5e8eb;
      --up: #f04452;
      --up-bg: #fff0f1;
      --down: #3182f6;
      --down-bg: #eef5ff;
      --flat: #4e5968;
      --flat-bg: #f2f4f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 16px 14px 48px;
      max-width: 480px;
      margin: 0 auto;
      font-variant-numeric: tabular-nums;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .header-right { display: flex; align-items: center; gap: 6px; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--sub);
      background: #e5e8eb;
      padding: 5px 10px;
      border-radius: 999px;
    }
    .refresh-btn {
      border: none;
      background: #191f28;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* Account Switcher */
    .acct-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: #e5e8eb;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .acct-btn {
      border: none;
      background: transparent;
      color: var(--sub);
      font-size: 13px;
      font-weight: 700;
      padding: 9px 4px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .acct-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
    }
    .label { font-size: 13px; color: var(--sub); font-weight: 600; }
    .big-num {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin: 4px 0 8px;
    }
    .pnl-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 10px;
    }
    .up { color: var(--up); background: var(--up-bg); }
    .down { color: var(--down); background: var(--down-bg); }
    .flat { color: var(--flat); background: var(--flat-bg); }

    /* Allocation Bar */
    .alloc-wrap { margin-top: 16px; }
    .alloc-bar {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      background: #eef1f4;
      gap: 2px;
    }
    .alloc-kw { background: #3182f6; border-radius: 999px 0 0 999px; }
    .alloc-okx { background: #191f28; border-radius: 0 999px 999px 0; }
    .alloc-legend {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--sub);
      font-weight: 600;
      margin-top: 6px;
    }

    /* 2x2 KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .kpi-box {
      background: #f8f9fb;
      border-radius: 14px;
      padding: 11px 12px;
    }
    .kpi-label { font-size: 11px; color: var(--muted); font-weight: 600; }
    .kpi-val { font-size: 15px; font-weight: 800; margin-top: 3px; color: var(--text); }

    /* Period Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin: 16px 0 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 0 0 auto;
      border: none;
      background: #f2f4f6;
      color: var(--sub);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #191f28;
      color: #fff;
    }

    /* Chart */
    .chart-box {
      margin-top: 10px;
      background: #fafbfd;
      border: 1px solid #edf0f4;
      border-radius: 16px;
      padding: 14px 12px 10px;
    }
    .chart-note {
      font-size: 11px;
      color: var(--sub);
      margin-top: 6px;
      text-align: center;
      font-weight: 500;
    }

    /* Date Controls */
    .date-panel {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f2f5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .date-row label { font-size: 12px; color: var(--sub); font-weight: 600; white-space: nowrap; }
    .date-inputs { display: flex; align-items: center; gap: 4px; }
    .date-row input[type="date"] {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--text);
      background: #fff;
    }

    /* Section Header & Clean Table */
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sec-title { font-size: 16px; font-weight: 800; }
    .sec-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 8px;
    }

    table.holdings {
      width: 100%;
      border-collapse: collapse;
    }
    table.holdings th {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-align: right;
      padding: 0 0 8px;
      border-bottom: 1px solid #f0f2f5;
    }
    table.holdings th:first-child { text-align: left; }
    table.holdings td {
      padding: 12px 0;
      border-bottom: 1px solid #f2f4f6;
      vertical-align: middle;
      text-align: right;
    }
    table.holdings tr:last-child td { border-bottom: none; padding-bottom: 2px; }
    table.holdings td:first-child { text-align: left; }

    .t-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .t-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .t-val { font-size: 14px; font-weight: 700; color: var(--text); }
    .rt-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
    }
    .c-up { color: var(--up); }
    .c-down { color: var(--down); }
    .c-flat { color: var(--sub); }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 내 자산 대시보드</h1>
    <div class="header-right">
      <span class="badge" id="asOf">로딩 중</span>
      <button class="refresh-btn" onclick="loadData()">새로고침</button>
    </div>
  </div>

  <div class="acct-tabs">
    <button class="acct-btn active" onclick="setAcct('all', this)">전체 합산</button>
    <button class="acct-btn" onclick="setAcct('kiwoom', this)">📈 키움</button>
    <button class="acct-btn" onclick="setAcct('okx', this)">🪙 OKX</button>
  </div>

  <div class="card">
    <div class="label" id="mainLabel">총 합산 자산 (키움 + OKX)</div>
    <div class="big-num" id="totalVal">-</div>
    <span class="pnl-pill flat" id="periodPnl">계산 중...</span>

    <div class="alloc-wrap">
      <div class="alloc-bar">
        <div class="alloc-kw" id="allocKwBar" style="width: 50%;"></div>
        <div class="alloc-okx" id="allocOkxBar" style="width: 50%;"></div>
      </div>
      <div class="alloc-legend">
        <span id="allocKwLabel">● 키움 -%</span>
        <span id="allocOkxLabel">● OKX -%</span>
      </div>
    </div>

    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="tabs">
      <button class="tab-btn active" data-period="today" onclick="setPeriod('today', this)">오늘</button>
      <button class="tab-btn" data-period="1w" onclick="setPeriod('1w', this)">1주</button>
      <button class="tab-btn" data-period="1m" onclick="setPeriod('1m', this)">1달</button>
      <button class="tab-btn" data-period="2m" onclick="setPeriod('2m', this)">2달</button>
      <button class="tab-btn" data-period="3m" onclick="setPeriod('3m', this)">3달</button>
      <button class="tab-btn" data-period="6m" onclick="setPeriod('6m', this)">6달</button>
      <button class="tab-btn" data-period="1y" onclick="setPeriod('1y', this)">1년</button>
      <button class="tab-btn" data-period="all" onclick="setPeriod('all', this)">전체</button>
    </div>

    <div class="chart-box">
      <svg id="chartSvg" viewBox="0 0 320 130" width="100%" height="130"></svg>
      <div class="chart-note" id="chartNote">데이터를 불러오는 중...</div>
    </div>

    <div class="date-panel">
      <div class="date-row">
        <label>원하는 날짜</label>
        <input type="date" id="singleDate" onchange="pickSingleDate(this.value)" />
      </div>
      <div class="date-row">
        <label>기간 지정</label>
        <div class="date-inputs">
          <input type="date" id="startDate" onchange="pickRange()" />
          <span style="font-size:12px;color:#8b95a1;">~</span>
          <input type="date" id="endDate" onchange="pickRange()" />
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="kiwoomCard">
    <div class="sec-head">
      <span class="sec-title">📈 키움 5280-4774</span>
      <span class="sec-badge" id="kwCardSub">-</span>
    </div>
    <table class="holdings">
      <thead>
        <tr>
          <th>종목 · 수량</th>
          <th>평가금액</th>
          <th>수익률 · 손익</th>
        </tr>
      </thead>
      <tbody id="kwRows"></tbody>
    </table>
  </div>

  <div class="card" id="okxCard">
    <div class="sec-head">
      <span class="sec-title">🪙 OKX 계좌</span>
      <span class="sec-badge" id="okxCardSub">-</span>
    </div>
    <table class="holdings">
      <thead>
        <tr>
          <th>계정 · 자산</th>
          <th>평가금액</th>
          <th>원화 환산</th>
        </tr>
      </thead>
      <tbody id="okxRows"></tbody>
    </table>
  </div>

  <script>
    let payload = null;
    let currentAcct = "all";
    let currentPeriod = "today";

    function fmtKrw(n) {
      const sign = n > 0 ? "+" : "";
      return sign + Math.round(n).toLocaleString() + "원";
    }
    function fmtPct(p) {
      const sign = p > 0 ? "+" : "";
      return sign + p.toFixed(2) + "%";
    }
    function getVal(d) {
      if (currentAcct === "kiwoom") return d.kiwoom_krw;
      if (currentAcct === "okx") return d.okx_krw;
      return d.total_krw;
    }

    async function loadData() {
      try {
        const res = await fetch("./data.json?t=" + Date.now());
        payload = await res.json();
        document.getElementById("asOf").textContent = payload.updated_at;

        const hist = payload.history;
        if (hist.length) {
          const minD = hist[0].date;
          const maxD = hist[hist.length - 1].date;
          ["singleDate", "startDate", "endDate"].forEach(id => {
            const el = document.getElementById(id);
            el.min = minD;
            el.max = maxD;
            el.value = id === "startDate" ? minD : maxD;
          });
        }
        renderAll();
      } catch (e) {
        document.getElementById("chartNote").textContent = "데이터를 불러오지 못했습니다.";
      }
    }

    function renderAll() {
      if (!payload) return;
      const latest = payload.history[payload.history.length - 1];
      const kw = payload.latest.kiwoom;
      const okx = payload.latest.okx;

      const total = latest.total_krw || 1;
      const kwPct = ((latest.kiwoom_krw / total) * 100).toFixed(1);
      const okxPct = (100 - parseFloat(kwPct)).toFixed(1);
      document.getElementById("allocKwBar").style.width = kwPct + "%";
      document.getElementById("allocOkxBar").style.width = okxPct + "%";
      document.getElementById("allocKwLabel").textContent = "● 키움 " + kwPct + "%";
      document.getElementById("allocOkxLabel").textContent = "● OKX " + okxPct + "%";

      const labelEl = document.getElementById("mainLabel");
      const valEl = document.getElementById("totalVal");
      const kpiGrid = document.getElementById("kpiGrid");
      const kwCard = document.getElementById("kiwoomCard");
      const okxCard = document.getElementById("okxCard");

      if (currentAcct === "all") {
        labelEl.textContent = "총 합산 자산 (키움 + OKX)";
        valEl.textContent = latest.total_krw.toLocaleString() + "원";
        kpiGrid.innerHTML = `
          <div class="kpi-box"><div class="kpi-label">📈 키움 추정자산</div><div class="kpi-val">${kw.total_est_krw.toLocaleString()}원</div></div>
          <div class="kpi-box"><div class="kpi-label">🪙 OKX 자산</div><div class="kpi-val">${okx.total_krw.toLocaleString()}원 ($${okx.total_usd.toFixed(2)})</div></div>
          <div class="kpi-box"><div class="kpi-label">주식 매입 / 평가</div><div class="kpi-val">${(kw.tot_pur_krw/10000).toFixed(0)}만 / ${(kw.tot_evlt_krw/10000).toFixed(0)}만</div></div>
          <div class="kpi-box"><div class="kpi-label">예수금 (D+2)</div><div class="kpi-val">${kw.d2_deposit_krw.toLocaleString()}원</div></div>
        `;
        kwCard.style.display = "block";
        okxCard.style.display = "block";
      } else if (currentAcct === "kiwoom") {
        labelEl.textContent = "키움증권 5280-4774 추정 자산";
        valEl.textContent = kw.total_est_krw.toLocaleString() + "원";
        kpiGrid.innerHTML = `
          <div class="kpi-box"><div class="kpi-label">총 매입금액</div><div class="kpi-val">${kw.tot_pur_krw.toLocaleString()}원</div></div>
          <div class="kpi-box"><div class="kpi-label">총 평가금액</div><div class="kpi-val">${kw.tot_evlt_krw.toLocaleString()}원</div></div>
          <div class="kpi-box"><div class="kpi-label">예수금</div><div class="kpi-val">${kw.deposit_krw.toLocaleString()}원</div></div>
          <div class="kpi-box"><div class="kpi-label">D+2 추정예수금</div><div class="kpi-val">${kw.d2_deposit_krw.toLocaleString()}원</div></div>
        `;
        kwCard.style.display = "block";
        okxCard.style.display = "none";
      } else {
        labelEl.textContent = "OKX 총 자산";
        valEl.textContent = "$" + okx.total_usd.toFixed(2) + " (" + okx.total_krw.toLocaleString() + "원)";
        kpiGrid.innerHTML = `
          <div class="kpi-box"><div class="kpi-label">Trading 계정</div><div class="kpi-val">$${okx.trading_usd.toFixed(2)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Funding 계정</div><div class="kpi-val">$${okx.funding_usd.toFixed(2)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Earn / 스테이킹</div><div class="kpi-val">$${okx.earn_usd.toFixed(2)}</div></div>
          <div class="kpi-box"><div class="kpi-label">열린 포지션</div><div class="kpi-val">${okx.positions.length}건</div></div>
        `;
        kwCard.style.display = "none";
        okxCard.style.display = "block";
      }

      // Kiwoom Table
      const kwSub = document.getElementById("kwCardSub");
      kwSub.textContent = fmtKrw(kw.tot_pl_krw) + " (" + fmtPct(kw.tot_prft_rt) + ")";
      kwSub.className = "sec-badge " + (kw.tot_pl_krw > 0 ? "up" : kw.tot_pl_krw < 0 ? "down" : "flat");

      document.getElementById("kwRows").innerHTML = kw.stocks.map(s => {
        const pillCls = s.pl > 0 ? "up" : s.pl < 0 ? "down" : "flat";
        const txtCls = s.pl > 0 ? "c-up" : s.pl < 0 ? "c-down" : "c-flat";
        return `
          <tr>
            <td>
              <div class="t-name">${s.name}</div>
              <div class="t-sub">${s.qty}주 · ${s.avg.toLocaleString()}→${s.cur.toLocaleString()}</div>
            </td>
            <td>
              <div class="t-val">${s.evlt.toLocaleString()}원</div>
            </td>
            <td>
              <span class="rt-tag ${pillCls}">${fmtPct(s.rt)}</span>
              <div class="t-sub ${txtCls}">${fmtKrw(s.pl)}</div>
            </td>
          </tr>`;
      }).join("");

      // OKX Table
      const okxSub = document.getElementById("okxCardSub");
      okxSub.textContent = (okx.pnl_usd >= 0 ? "+" : "") + "$" + okx.pnl_usd.toFixed(2) + " (" + fmtPct(okx.pnl_pct) + ")";
      okxSub.className = "sec-badge " + (okx.pnl_usd > 0 ? "up" : okx.pnl_usd < 0 ? "down" : "flat");

      document.getElementById("okxRows").innerHTML = okx.holdings.map(h => `
        <tr>
          <td>
            <div class="t-name">${h.name}</div>
            <div class="t-sub">${h.sub}</div>
          </td>
          <td><div class="t-val">$${h.usd.toFixed(2)}</div></td>
          <td><div class="t-sub" style="font-size:13px;font-weight:700;color:var(--text);">${h.krw.toLocaleString()}원</div></td>
        </tr>`).join("");

      applyPeriod(currentPeriod);
    }

    function setAcct(acct, btn) {
      currentAcct = acct;
      document.querySelectorAll(".acct-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      renderAll();
    }

    function setPeriod(period, btn) {
      currentPeriod = period;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      applyPeriod(period);
    }

    function filterByPeriod(period) {
      const hist = payload.history;
      if (!hist.length) return [];
      const latestDate = new Date(hist[hist.length - 1].date + "T00:00:00");
      const daysMap = { today: 0, "1w": 7, "1m": 30, "2m": 60, "3m": 90, "6m": 180, "1y": 365, all: 99999 };
      const days = daysMap[period] ?? 0;
      const cutoff = new Date(latestDate.getTime() - days * 86400000);
      return hist.filter(d => new Date(d.date + "T00:00:00") >= cutoff);
    }

    function updatePnlPill(points, label) {
      const pill = document.getElementById("periodPnl");
      const kw = payload.latest.kiwoom;
      const okx = payload.latest.okx;

      if (points.length >= 2) {
        const start = getVal(points[0]);
        const end = getVal(points[points.length - 1]);
        const diff = end - start;
        const pct = start ? (diff / start) * 100 : 0;
        pill.className = "pnl-pill " + (diff > 0 ? "up" : diff < 0 ? "down" : "flat");
        pill.textContent = `${label} 손익: ${fmtKrw(diff)} (${fmtPct(pct)})`;
      } else {
        if (currentAcct === "okx") {
          pill.className = "pnl-pill flat";
          pill.textContent = `보유 평가손익: $${okx.pnl_usd.toFixed(2)} (${fmtPct(okx.pnl_pct)} · 포지션 없음)`;
        } else {
          const pnl = kw.tot_pl_krw;
          const base = currentAcct === "kiwoom" ? kw.tot_pur_krw : (payload.history[0].total_krw - pnl);
          const pct = base ? (pnl / base) * 100 : 0;
          pill.className = "pnl-pill " + (pnl > 0 ? "up" : pnl < 0 ? "down" : "flat");
          pill.textContent = `${label} 평가손익: ${fmtKrw(pnl)} (${fmtPct(pct)})`;
        }
      }
    }

    function applyPeriod(period) {
      if (!payload) return;
      const labels = { today: "오늘", "1w": "1주", "1m": "1달", "2m": "2달", "3m": "3달", "6m": "6달", "1y": "1년", all: "전체" };
      const pts = filterByPeriod(period);
      updatePnlPill(pts, labels[period]);
      document.getElementById("chartNote").textContent =
        pts.length <= 1
          ? `${labels[period]} 추이 · 2026-11-23부터 매일 브리핑마다 자동 누적됩니다.`
          : `${labels[period]} (${pts[0].date} ~ ${pts[pts.length - 1].date} · ${pts.length}회 기록)`;
      renderChart(pts);
    }

    function pickSingleDate(val) {
      if (!payload) return;
      const found = payload.history.filter(d => d.date === val);
      if (found.length) {
        updatePnlPill(found, val);
        document.getElementById("chartNote").textContent = `${val} 조회: ${getVal(found[0]).toLocaleString()}원`;
        renderChart(found);
      } else {
        document.getElementById("chartNote").textContent = `${val} 데이터가 아직 없습니다.`;
      }
    }

    function pickRange() {
      if (!payload) return;
      const s = document.getElementById("startDate").value;
      const e = document.getElementById("endDate").value;
      const found = payload.history.filter(d => (!s || d.date >= s) && (!e || d.date <= e));
      if (found.length) {
        updatePnlPill(found, `${s}~${e}`);
        document.getElementById("chartNote").textContent = `${s || "~"} ~ ${e || "~"} (${found.length}건)`;
        renderChart(found);
      } else {
        document.getElementById("chartNote").textContent = "선택한 기간의 데이터가 아직 없습니다.";
      }
    }

    function renderChart(points) {
      const svg = document.getElementById("chartSvg");
      const w = 320, h = 130, padX = 16, padTop = 26, padBot = 22;
      svg.innerHTML = "";

      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      defs.innerHTML = `
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3182f6" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#3182f6" stop-opacity="0.0"/>
        </linearGradient>`;
      svg.appendChild(defs);

      [padTop, (h - padBot + padTop) / 2, h - padBot].forEach(y => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "line");
        g.setAttribute("x1", padX); g.setAttribute("x2", w - padX);
        g.setAttribute("y1", y); g.setAttribute("y2", y);
        g.setAttribute("stroke", "#eceff3"); g.setAttribute("stroke-dasharray", "3 3");
        svg.appendChild(g);
      });

      if (!points.length) return;
      if (points.length === 1) {
        const cx = w / 2, cy = (h - padBot + padTop) / 2;
        const glow = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        glow.setAttribute("cx", cx); glow.setAttribute("cy", cy); glow.setAttribute("r", 12);
        glow.setAttribute("fill", "#3182f6"); glow.setAttribute("opacity", "0.15");
        svg.appendChild(glow);

        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", 5.5);
        c.setAttribute("fill", "#3182f6"); c.setAttribute("stroke", "#fff"); c.setAttribute("stroke-width", "2");
        svg.appendChild(c);

        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", cx); t.setAttribute("y", cy - 18);
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("font-size", "11"); t.setAttribute("font-weight", "700"); t.setAttribute("fill", "#191f28");
        t.textContent = points[0].label + " · " + getVal(points[0]).toLocaleString() + "원";
        svg.appendChild(t);
        return;
      }

      const vals = points.map(getVal);
      const min = Math.min(...vals), max = Math.max(...vals);
      const span = (max - min) || 1;
      const coords = points.map((p, i) => {
        const x = padX + (i / (points.length - 1)) * (w - padX * 2);
        const y = h - padBot - ((getVal(p) - min) / span) * (h - padTop - padBot);
        return [x, y];
      });

      const linePts = coords.map(c => c[0].toFixed(1) + "," + c[1].toFixed(1)).join(" ");
      const areaPts = `${coords[0][0].toFixed(1)},${h - padBot} ${linePts} ${coords[coords.length - 1][0].toFixed(1)},${h - padBot}`;

      const area = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      area.setAttribute("fill", "url(#areaGrad)");
      area.setAttribute("points", areaPts);
      svg.appendChild(area);

      const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      poly.setAttribute("fill", "none"); poly.setAttribute("stroke", "#3182f6");
      poly.setAttribute("stroke-width", "2.5"); poly.setAttribute("stroke-linejoin", "round");
      poly.setAttribute("points", linePts);
      svg.appendChild(poly);

      const last = coords[coords.length - 1];
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", last[0]); dot.setAttribute("cy", last[1]); dot.setAttribute("r", 4.5);
      dot.setAttribute("fill", "#3182f6"); dot.setAttribute("stroke", "#fff"); dot.setAttribute("stroke-width", "1.5");
      svg.appendChild(dot);

      const minLbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      minLbl.setAttribute("x", padX); minLbl.setAttribute("y", h - 5);
      minLbl.setAttribute("font-size", "10"); minLbl.setAttribute("fill", "#8b95a1");
      minLbl.textContent = points[0].date.slice(5);
      svg.appendChild(minLbl);

      const maxLbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      maxLbl.setAttribute("x", w - padX); maxLbl.setAttribute("y", h - 5);
      maxLbl.setAttribute("text-anchor", "end");
      maxLbl.setAttribute("font-size", "10"); maxLbl.setAttribute("fill", "#8b95a1");
      maxLbl.textContent = points[points.length - 1].date.slice(5);
      svg.appendChild(maxLbl);
    }

    loadData();
  </script>
</body>
</html>
