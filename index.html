<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>자산 현황 · 매매일지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #f4f4f1;
      --surface: #ffffff;
      --surface-2: #ecece8;
      --ink: #141413;
      --ink-2: #575752;
      --ink-3: #8c8c85;
      --hairline: rgba(20, 20, 19, 0.08);
      --hairline-2: rgba(20, 20, 19, 0.14);
      --up: #d92d20;
      --up-bg: rgba(217, 45, 32, 0.09);
      --down: #1570ef;
      --down-bg: rgba(21, 112, 239, 0.09);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      padding: 18px 14px 72px;
      max-width: 960px;
      margin: 0 auto;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #12b76a; box-shadow: 0 0 0 3px rgba(18,183,106,0.16); }
    .brand-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .meta-time { font-size: 12px; color: var(--ink-3); font-weight: 500; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--hairline-2); background: var(--surface); color: var(--ink-2);
      cursor: pointer; transition: transform 150ms var(--ease-out);
    }
    .icon-btn:active { transform: scale(0.95); }

    .seg-nav {
      display: grid; grid-template-columns: 1fr 1fr;
      padding: 3px; background: var(--surface-2);
      border: 1px solid var(--hairline); border-radius: 10px;
      margin-bottom: 14px; max-width: 420px;
    }
    .seg-btn {
      height: 36px; border: none; border-radius: 7px;
      background: transparent; color: var(--ink-2);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: transform 150ms var(--ease-out), background-color 140ms ease, color 140ms ease;
    }
    .seg-btn:active { transform: scale(0.97); }
    .seg-btn.active { background: var(--surface); color: var(--ink); border: 1px solid var(--hairline); }

    .bento { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
    @media (min-width: 760px) { .bento { grid-template-columns: 1.15fr 0.85fr; } }

    .pill-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .pill-btn {
      height: 30px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
      font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: transform 140ms var(--ease-out), background-color 140ms ease, color 140ms ease;
    }
    .pill-btn:active { transform: scale(0.97); }
    .pill-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .panel {
      background: var(--surface); border: 1px solid var(--hairline);
      border-radius: 14px; padding: 18px; margin-bottom: 12px;
    }
    .panel-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
    .hero-figure { font-size: 32px; font-weight: 700; letter-spacing: -0.025em; margin: 4px 0 8px; }
    .delta-tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 6px; }

    .up { color: var(--up); background: var(--up-bg); }
    .down { color: var(--down); background: var(--down-bg); }
    .flat { color: var(--ink-2); background: var(--surface-2); }
    .c-up { color: var(--up); }
    .c-down { color: var(--down); }
    .c-flat { color: var(--ink-2); }

    .alloc-block { margin-top: 16px; }
    .alloc-track { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; gap: 2px; }
    .alloc-a { background: var(--ink); }
    .alloc-b { background: #9ca3af; }
    .alloc-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 7px; font-weight: 500; }

    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline);
    }
    .stat-grid-3 {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-top: 10px;
    }
    .stat-item { padding: 10px 11px; border-radius: 9px; background: var(--bg); }
    .stat-k { font-size: 11px; color: var(--ink-3); font-weight: 500; }
    .stat-v { font-size: 14px; font-weight: 700; margin-top: 2px; }
    .stat-s { font-size: 10px; color: var(--ink-3); margin-top: 2px; }

    .period-row { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; }
    .period-row::-webkit-scrollbar { display: none; }
    .p-btn {
      flex: 0 0 auto; height: 28px; padding: 0 10px; border-radius: 6px; border: none;
      background: transparent; color: var(--ink-3); font-family: inherit; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: transform 140ms var(--ease-out), background-color 140ms ease, color 140ms ease;
    }
    .p-btn:active { transform: scale(0.96); }
    .p-btn.active { background: var(--surface-2); color: var(--ink); }

    .chart-stage {
      margin-top: 12px; border: 1px solid var(--hairline); border-radius: 10px;
      padding: 12px; background: #fbfbfa;
    }
    .chart-readout { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
    .chart-date { font-size: 11px; color: var(--ink-3); font-weight: 600; }
    .chart-val { font-size: 13px; color: var(--ink); font-weight: 700; }
    .chart-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); margin-top: 4px; font-weight: 500; }
    .chart-note { font-size: 11px; color: var(--ink-3); margin-top: 6px; }

    .date-toggle {
      margin-top: 12px; font-size: 12px; color: var(--ink-2); cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; border: none; background: none;
      font-family: inherit; font-weight: 600;
    }
    .date-controls {
      display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hairline);
      flex-direction: column; gap: 8px;
    }
    .date-controls.open { display: flex; }
    .date-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .date-line label { font-size: 12px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
    .date-inputs { display: flex; align-items: center; gap: 4px; }
    input[type="date"] {
      border: 1px solid var(--hairline-2); border-radius: 6px; padding: 4px 8px;
      font-family: inherit; font-size: 12px; color: var(--ink); background: var(--surface);
    }

    .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .sec-title { font-size: 14px; font-weight: 700; }
    .sec-meta { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

    .holding-row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 11px 0; border-bottom: 1px solid var(--hairline);
    }
    .holding-row:last-child { border-bottom: none; padding-bottom: 0; }
    .h-left { min-width: 0; }
    .h-name { font-size: 14px; font-weight: 600; color: var(--ink); }
    .h-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-right { text-align: right; flex-shrink: 0; }
    .h-val { font-size: 14px; font-weight: 700; color: var(--ink); }
    .h-pnl { font-size: 12px; font-weight: 600; margin-top: 2px; }

    .search-box {
      width: 100%; height: 40px; border: 1px solid var(--hairline-2); border-radius: 8px;
      padding: 0 12px; font-family: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
      outline: none; transition: border-color 140ms ease, background-color 140ms ease;
    }
    .search-box:focus { border-color: var(--ink); background: var(--surface); }

    .btn-ghost {
      height: 28px; padding: 0 10px; border-radius: 6px;
      border: 1px solid var(--hairline-2); background: var(--surface); color: var(--ink-2);
      font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
    }

    .sym-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 760px) { .sym-grid { grid-template-columns: 1fr 1fr; } }

    .sym-card {
      border: 1px solid var(--hairline); border-radius: 12px; padding: 15px;
      background: var(--surface); cursor: pointer;
      transition: transform 150ms var(--ease-out);
    }
    .sym-card:active { transform: scale(0.985); }
    .sym-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .sym-name { font-size: 15px; font-weight: 700; color: var(--ink); }
    .sym-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .sym-pnl-box { text-align: right; flex-shrink: 0; }
    .sym-pnl-val { font-size: 15px; font-weight: 700; }
    .sym-pnl-rt { font-size: 12px; font-weight: 600; }
    .sym-flow {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hairline); font-size: 12px;
    }
    .sym-flow-col span { display: block; color: var(--ink-3); font-size: 11px; margin-bottom: 2px; }
    .sym-flow-col strong { font-weight: 600; color: var(--ink); }
    .sym-detail { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--hairline-2); }
    .sym-card.open .sym-detail { display: block; }
    .fill-line {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 6px 0; font-size: 12px; border-bottom: 1px solid var(--hairline);
    }
    .fill-line:last-child { border-bottom: none; }
    .side-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
    .side-buy { color: var(--up); background: var(--up-bg); }
    .side-sell { color: var(--down); background: var(--down-bg); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="live-dot"></span>
      <span class="brand-title">포트폴리오 · 매매일지</span>
    </div>
    <div class="topbar-right">
      <span class="meta-time" id="asOf">-</span>
      <button class="icon-btn" onclick="loadData()" title="새로고침" aria-label="새로고침">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="seg-nav">
    <button class="seg-btn active" onclick="setMode('portfolio', this)">자산 현황</button>
    <button class="seg-btn" onclick="setMode('journal', this)">매매일지</button>
  </nav>

  <!-- PORTFOLIO VIEW -->
  <main id="portfolioView">
    <div class="pill-row">
      <button class="pill-btn active" onclick="setAcct('all', this)">전체</button>
      <button class="pill-btn" onclick="setAcct('kiwoom', this)">키움 5280-4774</button>
      <button class="pill-btn" onclick="setAcct('okx', this)">OKX</button>
    </div>

    <div class="bento">
      <div>
        <section class="panel">
          <div class="panel-label" id="mainLabel">총 합산 자산</div>
          <div class="hero-figure" id="totalVal">-</div>
          <span class="delta-tag flat" id="periodPnl">-</span>

          <div class="alloc-block">
            <div class="alloc-track">
              <div class="alloc-a" id="allocKwBar" style="width: 50%;"></div>
              <div class="alloc-b" id="allocOkxBar" style="width: 50%;"></div>
            </div>
            <div class="alloc-meta">
              <span id="allocKwLabel">키움 -%</span>
              <span id="allocOkxLabel">OKX -%</span>
            </div>
          </div>

          <div class="stat-grid" id="kpiGrid"></div>
          <div class="stat-grid-3" id="riskGrid"></div>

          <div class="period-row">
            <button class="p-btn active" onclick="setPeriod('today', this)">오늘</button>
            <button class="p-btn" onclick="setPeriod('1w', this)">1주</button>
            <button class="p-btn" onclick="setPeriod('1m', this)">1달</button>
            <button class="p-btn" onclick="setPeriod('2m', this)">2달</button>
            <button class="p-btn" onclick="setPeriod('3m', this)">3달</button>
            <button class="p-btn" onclick="setPeriod('6m', this)">6달</button>
            <button class="p-btn" onclick="setPeriod('1y', this)">1년</button>
            <button class="p-btn" onclick="setPeriod('all', this)">전체</button>
          </div>

          <div class="chart-stage">
            <div class="chart-readout">
              <span class="chart-date" id="hoverDate">-</span>
              <span class="chart-val" id="hoverVal">-</span>
            </div>
            <svg id="chartSvg" viewBox="0 0 320 120" width="100%" height="120" style="touch-action:none;"></svg>
            <div class="chart-axis">
              <span id="axisStart">-</span>
              <span id="axisMid">-</span>
              <span id="axisEnd">-</span>
            </div>
            <div class="chart-note" id="chartNote">불러오는 중</div>
          </div>

          <button class="date-toggle" onclick="document.getElementById('dateControls').classList.toggle('open')">날짜 직접 조회 ▾</button>
          <div class="date-controls" id="dateControls">
            <div class="date-line">
              <label>특정 날짜</label>
              <input type="date" id="singleDate" onchange="pickSingleDate(this.value)" />
            </div>
            <div class="date-line">
              <label>기간 조회</label>
              <div class="date-inputs">
                <input type="date" id="startDate" onchange="pickRange()" />
                <span style="font-size:11px;color:var(--ink-3);">~</span>
                <input type="date" id="endDate" onchange="pickRange()" />
              </div>
            </div>
          </div>
        </section>
      </div>

      <div>
        <section class="panel" id="kiwoomCard">
          <div class="sec-head">
            <span class="sec-title">키움 5280-4774 보유 종목</span>
            <span class="sec-meta" id="kwCardSub">-</span>
          </div>
          <div id="kwRows"></div>
        </section>

        <section class="panel" id="okxCard">
          <div class="sec-head">
            <span class="sec-title">OKX 보유 현황</span>
            <span class="sec-meta" id="okxCardSub">-</span>
          </div>
          <div id="okxRows"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- TRADE JOURNAL VIEW -->
  <main id="journalView" style="display:none;">
    <div class="pill-row">
      <button class="pill-btn active" onclick="setJSource('all', this)">전체 (키움+OKX)</button>
      <button class="pill-btn" onclick="setJSource('키움', this)">키움 5280-4774</button>
      <button class="pill-btn" onclick="setJSource('OKX', this)">OKX</button>
    </div>

    <section class="panel">
      <div class="sec-head">
        <span class="sec-title" id="journalSummaryTitle">전체 손익 · 승률 요약</span>
        <button class="btn-ghost" onclick="exportCsv()">CSV 저장</button>
      </div>
      <div class="stat-grid" id="journalKpi" style="margin-top:0;padding-top:0;border-top:none;"></div>
      <div class="stat-grid-3" id="journalRiskGrid"></div>
      <div class="meta-time" id="journalNote" style="margin-top:10px;"></div>
    </section>

    <section class="panel">
      <div class="sec-head">
        <span class="sec-title">종목 검색</span>
        <span class="meta-time" id="tradeCountBadge">0종목</span>
      </div>
      <input type="text" class="search-box" id="searchInput" placeholder="종목명 입력 (예: 센서뷰, 파수AI, XRP)" oninput="renderJournal()" />
      <div class="pill-row" style="margin-top:10px;margin-bottom:0;">
        <button class="pill-btn active" onclick="setJTab('symbols', this)">종목별 손익</button>
        <button class="pill-btn" onclick="setJTab('daily', this)">일별 손익</button>
        <button class="pill-btn" onclick="setJTab('fills', this)">전체 체결</button>
      </div>
      <div class="period-row" id="outcomeRow" style="margin-top:8px;">
        <button class="p-btn active" onclick="setJOutcome('all', this)">전체</button>
        <button class="p-btn" onclick="setJOutcome('win', this)">수익만</button>
        <button class="p-btn" onclick="setJOutcome('loss', this)">손실만</button>
        <button class="p-btn" id="holdFilterBtn" onclick="setJOutcome('hold', this)">보유중</button>
      </div>
    </section>

    <div class="sym-grid" id="jSymbolsPane"></div>

    <section class="panel" id="jDailyPane" style="display:none;">
      <div class="sec-head">
        <span class="sec-title" id="dailyPnlTitle">일별 실현손익</span>
        <span class="sec-meta" id="dailyPnlBadge">-</span>
      </div>
      <div id="dailyPnlRows"></div>
    </section>

    <section class="panel" id="jFillsPane" style="display:none;">
      <div class="sec-head">
        <span class="sec-title">전체 체결 내역</span>
      </div>
      <div id="tradeRows"></div>
    </section>
  </main>

  <script>
    let payload = null;
    let currentAcct = "all";
    let currentPeriod = "today";
    let jTab = "symbols";
    let jSource = "all";
    let jOutcome = "all";

    function fmtKrw(n) {
      const sign = n > 0 ? "+" : "";
      return sign + Math.round(n).toLocaleString() + "원";
    }
    function fmtUsd(n) {
      const sign = n > 0 ? "+" : n < 0 ? "-" : "";
      return sign + "$" + Math.abs(n).toFixed(2);
    }
    function fmtPct(p) {
      const sign = p > 0 ? "+" : "";
      return sign + p.toFixed(2) + "%";
    }
    function getVal(d) {
      if (currentAcct === "kiwoom") return d.kiwoom_krw;
      if (currentAcct === "okx") return d.okx_krw;
      return d.total_krw;
    }
    function usdKrwRate() {
      if (!payload) return 1347;
      const o = payload.latest.okx;
      return o.total_usd ? (o.total_krw / o.total_usd) : 1347;
    }

    function buildRealizedSeries(acct) {
      if (!payload) return [];
      const rate = usdKrwRate();
      const map = {};
      if (acct === "all" || acct === "kiwoom") {
        (payload.daily_pnl || []).forEach(d => { map[d.date] = (map[d.date] || 0) + d.realized_pl; });
      }
      if (acct === "all" || acct === "okx") {
        (payload.trades || []).filter(t => t.source === "OKX" && t.side === "매도").forEach(t => {
          const v = acct === "okx" ? (t.pnl || 0) : Math.round((t.pnl || 0) * rate);
          map[t.date] = (map[t.date] || 0) + v;
        });
      }
      const dates = Object.keys(map).sort((a, b) => a.localeCompare(b));
      let cum = 0;
      return dates.map(date => { cum += map[date]; return { date, daily: map[date], cum }; });
    }

    // Compute CAGR, MDD (max drawdown on equity curve), and Profit Factor
    function computeMetrics(acct) {
      if (!payload) return { cagrStr: "-", mddStr: "-", pfStr: "-", mddSub: "", cagrSub: "" };
      const kw = payload.latest.kiwoom;
      const okx = payload.latest.okx;
      const rate = usdKrwRate();
      const baseCapital = acct === "kiwoom"
        ? kw.total_est_krw
        : (acct === "okx" ? okx.total_usd : (kw.total_est_krw + okx.total_krw));

      const series = buildRealizedSeries(acct);
      const fmt = v => acct === "okx" ? fmtUsd(v) : fmtKrw(v);

      let mddAmt = 0;
      let peak = 0;
      if (series.length) {
        series.forEach(pt => {
          if (pt.cum > peak) peak = pt.cum;
          const dd = pt.cum - peak;
          if (dd < mddAmt) mddAmt = dd;
        });
      }
      const mddPct = baseCapital > 0 ? (mddAmt / baseCapital) * 100 : 0;

      let cagr = 0;
      let days = 1;
      if (series.length >= 2) {
        const d0 = new Date(series[0].date + "T00:00:00");
        const d1 = new Date(series[series.length - 1].date + "T00:00:00");
        days = Math.max(1, Math.round((d1 - d0) / 86400000));
        const totalRet = baseCapital > 0 ? (series[series.length - 1].cum / baseCapital) : 0;
        if (1 + totalRet > 0) {
          cagr = (Math.pow(1 + totalRet, 365 / days) - 1) * 100;
        }
      }

      const syms = (payload.symbol_summaries || []).filter(s => acct === "all" || (acct === "kiwoom" ? s.source === "키움" : s.source === "OKX"));
      let grossWin = 0, grossLoss = 0;
      syms.forEach(s => {
        const pl = (acct === "all" && s.currency === "USD") ? s.realized_pl * rate : s.realized_pl;
        if (pl > 0) grossWin += pl;
        else if (pl < 0) grossLoss += Math.abs(pl);
      });
      const pf = grossLoss > 0 ? (grossWin / grossLoss).toFixed(2) : (grossWin > 0 ? "∞" : "-");

      return {
        cagrStr: fmtPct(cagr),
        cagrSub: `${days}일 연환산`,
        mddStr: `${mddPct.toFixed(2)}%`,
        mddSub: `고점 대비 ${fmt(mddAmt)}`,
        pfStr: pf === "∞" ? "∞" : `${pf}배`,
        pfSub: "총이익 / 총손실"
      };
    }

    async function loadData() {
      try {
        const res = await fetch("./data.json?t=" + Date.now());
        payload = await res.json();
        document.getElementById("asOf").textContent = payload.updated_at;

        const series = buildRealizedSeries("all");
        const hist = payload.history || [];
        const minD = series.length ? series[0].date : (hist[0]?.date || "2026-01-01");
        const maxD = hist.length ? hist[hist.length - 1].date : (series[series.length - 1]?.date || "2026-11-23");
        ["singleDate", "startDate", "endDate"].forEach(id => {
          const el = document.getElementById(id);
          el.min = minD; el.max = maxD;
          el.value = id === "startDate" ? minD : maxD;
        });
        renderAll();
        renderJournal();
      } catch (e) {
        document.getElementById("chartNote").textContent = "데이터를 불러오지 못했습니다";
      }
    }

    function renderJournal() {
      if (!payload) return;
      const summaries = payload.symbol_summaries || [];
      const trades = payload.trades || [];
      const kwDaily = payload.daily_pnl || [];
      const rate = usdKrwRate();

      const okxSyms = summaries.filter(s => s.source === "OKX");
      const okxRealizedUsd = okxSyms.reduce((a, b) => a + (b.realized_pl || 0), 0);
      const okxRealizedKrw = Math.round(okxRealizedUsd * rate);
      const okxUnrealizedUsd = payload.latest.okx.pnl_usd || 0;
      const okxUnrealizedKrw = Math.round(okxUnrealizedUsd * rate);

      const kwRealized = payload.kw_total_realized_pl || 0;
      const kwUnrealized = payload.latest.kiwoom.tot_pl_krw || 0;

      const scopedSyms = summaries.filter(s => jSource === "all" || s.source === jSource);
      const settled = scopedSyms.filter(s => s.sell_qty > 0 && s.realized_pl !== 0);
      const wins = settled.filter(s => s.realized_pl > 0).length;
      const winRate = settled.length ? Math.round((wins / settled.length) * 100) : 0;

      const titleEl = document.getElementById("journalSummaryTitle");
      const kpiEl = document.getElementById("journalKpi");
      const noteEl = document.getElementById("journalNote");

      if (jSource === "all") {
        const totRealized = kwRealized + okxRealizedKrw;
        const totUnrealized = kwUnrealized + okxUnrealizedKrw;
        titleEl.textContent = "총 합산 손익 · 승률 요약 (키움 + OKX)";
        kpiEl.innerHTML = `
          <div class="stat-item"><div class="stat-k">총 누적 실현손익</div><div class="stat-v ${totRealized >= 0 ? 'c-up' : 'c-down'}">${fmtKrw(totRealized)}</div></div>
          <div class="stat-item"><div class="stat-k">총 현재 평가손익</div><div class="stat-v ${totUnrealized >= 0 ? 'c-up' : 'c-down'}">${fmtKrw(totUnrealized)}</div></div>
          <div class="stat-item"><div class="stat-k">총 합산 (실현+평가)</div><div class="stat-v ${(totRealized+totUnrealized) >= 0 ? 'c-up' : 'c-down'}">${fmtKrw(totRealized + totUnrealized)}</div></div>
          <div class="stat-item"><div class="stat-k">전체 매도 승률</div><div class="stat-v">${winRate}% (${wins}/${settled.length}종목)</div></div>
        `;
        noteEl.textContent = `키움 올해(+${kwRealized.toLocaleString()}원) + OKX 최근 3개월(${fmtUsd(okxRealizedUsd)} · 약 ${fmtKrw(okxRealizedKrw)}) 합산`;
      } else if (jSource === "키움") {
        titleEl.textContent = "키움 5280-4774 손익 · 승률 요약";
        kpiEl.innerHTML = `
          <div class="stat-item"><div class="stat-k">키움 올해 실현손익</div><div class="stat-v ${kwRealized >= 0 ? 'c-up' : 'c-down'}">${fmtKrw(kwRealized)}</div></div>
          <div class="stat-item"><div class="stat-k">키움 현재 평가손익</div><div class="stat-v ${kwUnrealized >= 0 ? 'c-up' : 'c-down'}">${fmtKrw(kwUnrealized)}</div></div>
          <div class="stat-item"><div class="stat-k">키움 합산 손익</div><div class="stat-v ${(kwRealized+kwUnrealized) >= 0 ? 'c-up' : 'c-down'}">${fmtKrw(kwRealized + kwUnrealized)}</div></div>
          <div class="stat-item"><div class="stat-k">키움 매도 승률</div><div class="stat-v">${winRate}% (${wins}/${settled.length}종목)</div></div>
        `;
        noteEl.textContent = "2026-01-01 ~ 현재 키움 전체 체결 기준";
      } else {
        titleEl.textContent = "OKX 손익 · 승률 요약 (최근 3개월)";

      const acctKey = jSource === "키움" ? "kiwoom" : (jSource === "OKX" ? "okx" : "all");
      const m = computeMetrics(acctKey);
      document.getElementById("journalRiskGrid").innerHTML = `
        <div class="stat-item"><div class="stat-k">CAGR (연환산)</div><div class="stat-v ${m.cagrStr.startsWith('+') ? 'c-up' : m.cagrStr.startsWith('-') ? 'c-down' : ''}">${m.cagrStr}</div><div class="stat-s">${m.cagrSub}</div></div>
        <div class="stat-item"><div class="stat-k">MDD (최대낙폭)</div><div class="stat-v c-down">${m.mddStr}</div><div class="stat-s">${m.mddSub}</div></div>
        <div class="stat-item"><div class="stat-k">손익비 (PF)</div><div class="stat-v">${m.pfStr}</div><div class="stat-s">${m.pfSub}</div></div>
      `;

      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const filteredSyms = scopedSyms.filter(s => {
        if (q && !s.symbol.toLowerCase().includes(q)) return false;
        if (jOutcome === "win" && !(s.realized_pl > 0 || s.unrealized_pl > 0)) return false;
        if (jOutcome === "loss" && !(s.realized_pl < 0 || s.unrealized_pl < 0)) return false;
        if (jOutcome === "hold" && !(s.holding_qty > 0)) return false;

      document.getElementById("tradeCountBadge").textContent = filteredSyms.length + "종목";

      document.getElementById("jSymbolsPane").innerHTML = filteredSyms.map(s => {
        const isKrw = s.currency === "KRW";

        const isHolding = s.holding_qty > 0;
        const mainPnl = isHolding ? s.unrealized_pl : (hasSell ? s.realized_pl : 0);
        const cls = mainPnl > 0 ? "c-up" : mainPnl < 0 ? "c-down" : "c-flat";

        let pnlText = "-";
        let rtText = "";
        if (isHolding) {
          pnlText = isKrw ? fmtKrw(s.unrealized_pl) : fmtUsd(s.unrealized_pl);
          rtText = "보유 평가 " + fmtPct(s.unrealized_rt) + (s.realized_pl ? ` · 기실현 ${fmtKrw(s.realized_pl)}` : "");
        } else if (hasSell && s.realized_pl !== 0) {
          pnlText = isKrw ? fmtKrw(s.realized_pl) : `${fmtUsd(s.realized_pl)} (${fmtKrw(s.realized_pl * rate)})`;
          rtText = "매도 실현 " + fmtPct(s.realized_rt);
        } else if (hasSell) {
          pnlText = hasBuy ? "이전 보유분 선매도" : "이전 보유분 매도";
          rtText = hasBuy ? "눌러서 상세 확인" : "매수기록 기간 외";
        }

        const buyLine = hasBuy
          ? (isKrw ? `${s.buy_qty.toLocaleString()}주 · 평균 ${s.avg_buy.toLocaleString()}원` : `${s.buy_qty.toFixed(2)} · 평균 $${s.avg_buy.toFixed(4)}`)
          : "기간 내 매수 없음";
        let sellLine = "";
        if (hasSell && isHolding) {
          sellLine = isKrw ? `매도 ${s.sell_qty}주 / 보유 ${s.holding_qty}주` : `매도 ${s.sell_qty.toFixed(2)} / 보유`;
        } else if (hasSell) {
          sellLine = isKrw ? `${s.sell_qty.toLocaleString()}주 · 평균 ${s.avg_sell.toLocaleString()}원` : `${s.sell_qty.toFixed(2)} · 평균 $${s.avg_sell.toFixed(4)}`;
        } else if (isHolding) {
          sellLine = `현재 ${s.holding_qty}주 보유 중`;

          sellLine = "매도 없음";
        }

        const symTrades = trades.filter(t => t.source === s.source && t.symbol === s.symbol);
        const fillsHtml = symTrades.map(t => {

          return `
            <div class="fill-line">
              <div><span class="side-tag ${sCls}">${t.side}</span>${t.date} ${t.time}</div>

            </div>`;
        }).join("");

        return `
          <div class="sym-card" onclick="this.classList.toggle('open')">
            <div class="sym-card-top">
              <div>
                <div class="sym-name">${s.symbol}</div>
                <div class="sym-sub">${s.source} · 최근 ${s.last_date} · ${s.trade_count}건</div>

              <div class="sym-pnl-box">

      const filteredTrades = trades.filter(t => {

        if (q && !t.symbol.toLowerCase().includes(q)) return false;
        return true;

          <div class="holding-row">

              <div class="h-name"><span class="side-tag ${sCls}">${t.side}</span>${t.symbol}</div>

              <div class="h-val">${amtStr}</div>

        if (!okxDailyMap[t.date]) okxDailyMap[t.date] = { date: t.date, buy: 0, sell: 0, pl: 0 };
        if (t.side === "매수") okxDailyMap[t.date].buy += t.amount;
        else { okxDailyMap[t.date].sell += t.amount; okxDailyMap[t.date].pl += (t.pnl || 0); }
      });
      const okxDaily = Object.values(okxDailyMap).sort((a, b) => b.date.localeCompare(a.date));

      const dailyTitle = document.getElementById("dailyPnlTitle");
      const pnlBadge = document.getElementById("dailyPnlBadge");
      if (jSource === "OKX") {
        dailyTitle.textContent = "일별 실현손익 (OKX · 3개월)";
        pnlBadge.textContent = fmtUsd(okxRealizedUsd);
        pnlBadge.className = "sec-meta " + (okxRealizedUsd > 0 ? "up" : okxRealizedUsd < 0 ? "down" : "flat");
        const rows = okxDaily.filter(d => jOutcome === "all" || (jOutcome === "win" && d.pl > 0) || (jOutcome === "loss" && d.pl < 0));
        document.getElementById("dailyPnlRows").innerHTML = rows.map(d => {
          const cls = d.pl > 0 ? "c-up" : d.pl < 0 ? "c-down" : "c-flat";
          return `
            <div class="holding-row">
              <div class="h-left"><div class="h-name">${d.date}</div><div class="h-sub">매도 $${d.sell.toFixed(2)} · 매수 $${d.buy.toFixed(2)}</div></div>
              <div class="h-right"><div class="h-val ${cls}">${fmtUsd(d.pl)}</div></div>
            </div>`;
        }).join("") || `<div style="padding:16px 0;text-align:center;color:var(--ink-3);font-size:13px;">해당 조건의 일별 기록이 없습니다</div>`;
      } else {
        dailyTitle.textContent = jSource === "키움" ? "일별 실현손익 (키움)" : "일별 실현손익 (키움 + OKX)";
        const combined = kwRealized + (jSource === "all" ? okxRealizedKrw : 0);
        pnlBadge.textContent = fmtKrw(combined);
        pnlBadge.className = "sec-meta " + (combined > 0 ? "up" : combined < 0 ? "down" : "flat");
        let merged = kwDaily.map(d => ({ date: d.date, sub: `키움 · 매도 ${d.sell_amt.toLocaleString()} · 매수 ${d.buy_amt.toLocaleString()}`, pl: d.realized_pl }));
        if (jSource === "all") {
          okxDaily.forEach(d => merged.push({ date: d.date, sub: `OKX · 매도 $${d.sell.toFixed(2)} · 매수 $${d.buy.toFixed(2)}`, pl: Math.round(d.pl * rate), usd: d.pl }));
        }
        merged = merged.filter(d => jOutcome === "all" || (jOutcome === "win" && d.pl > 0) || (jOutcome === "loss" && d.pl < 0));
        merged.sort((a, b) => b.date.localeCompare(a.date));
        document.getElementById("dailyPnlRows").innerHTML = merged.map(d => {
          const cls = d.pl > 0 ? "c-up" : d.pl < 0 ? "c-down" : "c-flat";
          return `
            <div class="holding-row">
              <div class="h-left"><div class="h-name">${d.date}</div><div class="h-sub">${d.sub}</div></div>
              <div class="h-right"><div class="h-val ${cls}">${d.usd !== undefined ? fmtUsd(d.usd) + " (" + fmtKrw(d.pl) + ")" : fmtKrw(d.pl)}</div></div>
            </div>`;
        }).join("") || `<div style="padding:16px 0;text-align:center;color:var(--ink-3);font-size:13px;">해당 조건의 일별 기록이 없습니다</div>`;
      }
    }

    function exportCsv() {
      if (!payload || !payload.trades) return;
      const header = ["계좌", "날짜", "시간", "종목", "구분", "수량", "단가", "거래금액", "실현손익", "통화"];
      const rows = payload.trades.map(t => [t.source, t.date, t.time, t.symbol, t.side, t.qty, t.price, t.amount, t.pnl || 0, t.currency]);
      const csv = "\uFEFF" + [header, ...rows].map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "trade-journal.csv";
      a.click();
    }

    function setAcct(acct, btn) {
      currentAcct = acct;
      btn.parentElement.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderAll();
    }

    function setPeriod(period, btn) {
      currentPeriod = period;
      btn.parentElement.querySelectorAll(".p-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      applyPeriod(period);
    }

    function filterHistByPeriod(period) {
      const hist = payload.history;
      if (!hist.length) return [];
      const latestDate = new Date(hist[hist.length - 1].date + "T00:00:00");
      const daysMap = { today: 0, "1w": 7, "1m": 30, "2m": 60, "3m": 90, "6m": 180, "1y": 365, all: 99999 };
      const days = daysMap[period] ?? 0;
      const cutoff = new Date(latestDate.getTime() - days * 86400000);
      return hist.filter(d => new Date(d.date + "T00:00:00") >= cutoff);
    }

    function filterSeriesByPeriod(series, period) {
      if (!series.length) return [];
      const latestStr = payload.history[payload.history.length - 1]?.date || series[series.length - 1].date;
      const latestDate = new Date(latestStr + "T00:00:00");
      const daysMap = { today: 0, "1w": 7, "1m": 30, "2m": 60, "3m": 90, "6m": 180, "1y": 365, all: 99999 };
      const days = daysMap[period] ?? 0;
      const cutoff = new Date(latestDate.getTime() - days * 86400000);
      const filtered = series.filter(s => new Date(s.date + "T00:00:00") >= cutoff);
      let cum = 0;
      return filtered.map(s => { cum += s.daily; return { date: s.date, daily: s.daily, cum }; });
    }

    function applyPeriod(period) {
      if (!payload) return;
      const labels = { today: "오늘", "1w": "1주", "1m": "1달", "2m": "2달", "3m": "3달", "6m": "6달", "1y": "1년", all: "전체" };
      const label = labels[period];
      const histPts = filterHistByPeriod(period);

      if (histPts.length >= 2) {
        const start = getVal(histPts[0]);
        const end = getVal(histPts[histPts.length - 1]);
        const diff = end - start;
        const pct = start ? (diff / start) * 100 : 0;
        const pill = document.getElementById("periodPnl");
        pill.className = "delta-tag " + (diff > 0 ? "up" : diff < 0 ? "down" : "flat");
        pill.textContent = `${label} ${fmtKrw(diff)} (${fmtPct(pct)})`;
        renderAssetChart(histPts, label);
        return;
      }

      const fullSeries = buildRealizedSeries(currentAcct);
      const scoped = period === "today" ? fullSeries : filterSeriesByPeriod(fullSeries, period);
      const pill = document.getElementById("periodPnl");
      const kw = payload.latest.kiwoom;
      const okx = payload.latest.okx;

      if (period === "today") {
        if (currentAcct === "okx") {
          pill.className = "delta-tag flat";
          pill.textContent = `오늘 평가손익 $${okx.pnl_usd.toFixed(2)} (${fmtPct(okx.pnl_pct)})`;
        } else {
          const pnl = kw.tot_pl_krw;
          const base = currentAcct === "kiwoom" ? kw.tot_pur_krw : (payload.history[0].total_krw - pnl);
          const pct = base ? (pnl / base) * 100 : 0;
          pill.className = "delta-tag " + (pnl > 0 ? "up" : pnl < 0 ? "down" : "flat");
          pill.textContent = `오늘 평가손익 ${fmtKrw(pnl)} (${fmtPct(pct)})`;
        }
        renderRealizedChart(fullSeries, currentAcct === "okx" ? "OKX 최근 3개월 누적 실현손익" : (currentAcct === "kiwoom" ? "키움 올해 누적 실현손익" : "전체 누적 실현손익"));
      } else {
        const periodSum = scoped.length ? scoped[scoped.length - 1].cum : 0;
        pill.className = "delta-tag " + (periodSum > 0 ? "up" : periodSum < 0 ? "down" : "flat");
        pill.textContent = currentAcct === "okx"
          ? `${label} 실현손익 ${fmtUsd(periodSum)}`
          : `${label} 실현손익 ${fmtKrw(periodSum)}`;
        renderRealizedChart(scoped.length ? scoped : fullSeries, `${label} 실현손익 추이`);
      }
    }

    function pickSingleDate(val) {
      if (!payload || !val) return;
      const full = buildRealizedSeries(currentAcct);
      const found = full.filter(s => s.date === val);
      const pill = document.getElementById("periodPnl");
      if (found.length) {
        const v = found[0].daily;
        pill.className = "delta-tag " + (v > 0 ? "up" : v < 0 ? "down" : "flat");
        pill.textContent = currentAcct === "okx" ? `${val} 실현 ${fmtUsd(v)}` : `${val} 실현 ${fmtKrw(v)}`;
        renderRealizedChart(found, val);
      } else {
        pill.className = "delta-tag flat";
        pill.textContent = `${val} 매도 기록 없음`;
        document.getElementById("chartNote").textContent = `${val}에는 체결된 매도 기록이 없습니다`;
      }
    }

    function pickRange() {
      if (!payload) return;
      const s = document.getElementById("startDate").value;
      const e = document.getElementById("endDate").value;
      const full = buildRealizedSeries(currentAcct);
      const filtered = full.filter(x => (!s || x.date >= s) && (!e || x.date <= e));
      let cum = 0;
      const scoped = filtered.map(x => { cum += x.daily; return { date: x.date, daily: x.daily, cum }; });
      const pill = document.getElementById("periodPnl");
      if (scoped.length) {
        pill.className = "delta-tag " + (cum > 0 ? "up" : cum < 0 ? "down" : "flat");
        pill.textContent = currentAcct === "okx" ? `${s}~${e} ${fmtUsd(cum)}` : `${s}~${e} ${fmtKrw(cum)}`;
        renderRealizedChart(scoped, `${s} ~ ${e}`);
      } else {
        pill.className = "delta-tag flat";
        pill.textContent = `${s}~${e} 기록 없음`;
        document.getElementById("chartNote").textContent = "선택한 기간의 체결 기록이 없습니다";
      }
    }

    function renderRealizedChart(series, titleLabel) {
      const svg = document.getElementById("chartSvg");
      const w = 320, h = 120, padX = 10, padTop = 14, padBot = 14;
      svg.innerHTML = "";
      const hoverDate = document.getElementById("hoverDate");
      const hoverVal = document.getElementById("hoverVal");
      const noteEl = document.getElementById("chartNote");
      const fmt = v => currentAcct === "okx" ? fmtUsd(v) : fmtKrw(v);

      if (!series.length) {
        hoverDate.textContent = titleLabel;
        hoverVal.textContent = "-";
        document.getElementById("axisStart").textContent = "-";
        document.getElementById("axisMid").textContent = "";
        document.getElementById("axisEnd").textContent = "-";
        noteEl.textContent = "표시할 체결 기록이 없습니다";
        return;
      }

      if (series.length === 1) {
        hoverDate.textContent = series[0].date;
        hoverVal.textContent = fmt(series[0].cum);
        document.getElementById("axisStart").textContent = series[0].date.slice(5);
        document.getElementById("axisMid").textContent = "";
        document.getElementById("axisEnd").textContent = "";
        noteEl.textContent = `${titleLabel} (1건)`;
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", w / 2); c.setAttribute("cy", h / 2); c.setAttribute("r", 4); c.setAttribute("fill", "#141413");
        svg.appendChild(c);
        return;
      }

      const vals = series.map(s => s.cum);
      const min = Math.min(...vals, 0), max = Math.max(...vals, 1);
      const span = (max - min) || 1;
      const toY = v => h - padBot - ((v - min) / span) * (h - padTop - padBot);

      // 0-baseline dashed reference line
      const zeroY = toY(0);
      const zeroLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
      zeroLine.setAttribute("x1", padX); zeroLine.setAttribute("x2", w - padX);
      zeroLine.setAttribute("y1", zeroY.toFixed(1)); zeroLine.setAttribute("y2", zeroY.toFixed(1));
      zeroLine.setAttribute("stroke", "rgba(20,20,19,0.16)"); zeroLine.setAttribute("stroke-dasharray", "3 3");
      svg.appendChild(zeroLine);

      const coords = series.map((s, i) => ({
        x: padX + (i / (series.length - 1)) * (w - padX * 2),
        y: toY(s.cum),
        item: s
      }));
      const linePts = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPts = `${coords[0].x.toFixed(1)},${zeroY.toFixed(1)} ${linePts} ${coords[coords.length - 1].x.toFixed(1)},${zeroY.toFixed(1)}`;
      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      defs.innerHTML = `<linearGradient id="cumG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#141413" stop-opacity="0.14"/><stop offset="100%" stop-color="#141413" stop-opacity="0.01"/></linearGradient>`;
      svg.appendChild(defs);
      const polyArea = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      polyArea.setAttribute("fill", "url(#cumG)"); polyArea.setAttribute("points", areaPts);
      svg.appendChild(polyArea);
      const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      poly.setAttribute("fill", "none"); poly.setAttribute("stroke", "#141413");
      poly.setAttribute("stroke-width", "1.9"); poly.setAttribute("points", linePts);
      svg.appendChild(poly);

      // Interactive crosshair + dot
      const xhair = document.createElementNS("http://www.w3.org/2000/svg", "line");
      xhair.setAttribute("stroke", "rgba(20,20,19,0.28)"); xhair.setAttribute("stroke-width", "1");
      xhair.style.display = "none";
      svg.appendChild(xhair);

      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("r", "3.5"); dot.setAttribute("fill", "#141413");
      dot.setAttribute("cx", coords[coords.length - 1].x); dot.setAttribute("cy", coords[coords.length - 1].y);
      svg.appendChild(dot);

      const midIdx = Math.floor(series.length / 2);
      document.getElementById("axisStart").textContent = series[0].date.slice(5);
      document.getElementById("axisMid").textContent = series[midIdx].date.slice(5);
      document.getElementById("axisEnd").textContent = series[series.length - 1].date.slice(5);

      hoverDate.textContent = `${titleLabel}`;
      hoverVal.textContent = fmt(series[series.length - 1].cum);
      noteEl.textContent = `최고 ${fmt(Math.max(...vals))} · 최저 ${fmt(Math.min(...vals))} · 터치하여 날짜별 확인`;

      const onP = (cx) => {
        const rect = svg.getBoundingClientRect();
        const sx = ((cx - rect.left) / rect.width) * w;
        let near = coords[0], best = Math.abs(sx - near.x);
        for (const c of coords) { const d = Math.abs(sx - c.x); if (d < best) { best = d; near = c; } }
        xhair.style.display = "block";
        xhair.setAttribute("x1", near.x); xhair.setAttribute("x2", near.x);
        xhair.setAttribute("y1", padTop); xhair.setAttribute("y2", h - padBot);
        dot.setAttribute("cx", near.x); dot.setAttribute("cy", near.y);
        hoverDate.textContent = near.item.date;
        hoverVal.textContent = fmt(near.item.cum) + ` (당일 ${fmt(near.item.daily)})`;
      };
      svg.onpointermove = (e) => onP(e.clientX);
      svg.onpointerdown = (e) => onP(e.clientX);
    }

    function renderAssetChart(points, label) {
      const svg = document.getElementById("chartSvg");
      const w = 320, h = 120, padX = 10, padTop = 14, padBot = 14;
      svg.innerHTML = "";
      const last = points[points.length - 1];
      document.getElementById("hoverDate").textContent = last.date;
      document.getElementById("hoverVal").textContent = getVal(last).toLocaleString() + "원";
      document.getElementById("axisStart").textContent = points[0].date.slice(5);
      document.getElementById("axisMid").textContent = points[Math.floor(points.length / 2)].date.slice(5);
      document.getElementById("axisEnd").textContent = last.date.slice(5);
      document.getElementById("chartNote").textContent = `${label} · ${points[0].date} → ${last.date} (${points.length}건)`;
      const vals = points.map(getVal);
      const min = Math.min(...vals), max = Math.max(...vals);
      const span = (max - min) || 1;
      const coords = points.map((p, i) => ({
        x: padX + (i / (points.length - 1)) * (w - padX * 2),
        y: h - padBot - ((getVal(p) - min) / span) * (h - padTop - padBot),
        point: p
      }));
      const linePts = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      poly.setAttribute("fill", "none"); poly.setAttribute("stroke", "#141413");
      poly.setAttribute("stroke-width", "1.9"); poly.setAttribute("points", linePts);
      svg.appendChild(poly);
    }

    loadData();
  </script>
</body>
</html>
